name: xml-masker-v2
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Positive control - raw should be masked
        run: echo "RAW=${{ secrets.XML_TEST_SECRET }}"

      - name: XML entity encode
        run: |
          SECRET="${{ secrets.XML_TEST_SECRET }}"
          XML=$(python3 -c "import html; print(html.escape('$SECRET'))")
          echo "XML_ENCODED=$XML"

      - name: Manual XML encode
        env:
          S: ${{ secrets.XML_TEST_SECRET }}
        run: |
          python3 -c "
import os, html
s = os.environ.get('S', '')
encoded = html.escape(s)
print(f'MANUAL_XML={encoded}')
"

