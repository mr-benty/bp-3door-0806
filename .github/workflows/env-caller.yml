name: env-secret-caller
on: workflow_dispatch
jobs:
  # Job 1: runs in the environment (has access to env secrets)
  env-job:
    runs-on: ubuntu-latest
    environment: production-test
    steps:
      - name: Env secret accessible here
        env:
          E: ${{ secrets.ENV_ONLY_SECRET }}
        run: |
          if [ -n "$E" ]; then
            echo "ENV_JOB_HAS_SECRET=true (length=${#E})"
          else
            echo "ENV_JOB_HAS_SECRET=false"
          fi

  # Job 2: calls reusable workflow with secrets:inherit (NO environment)
  callee-job:
    uses: arlo-kovac/env-secret-callee/.github/workflows/callee.yml@main
    secrets: inherit
