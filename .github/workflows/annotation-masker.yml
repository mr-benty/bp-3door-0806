name: annotation-masker-test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Create annotation with XML-encoded secret
        env:
          S: ${{ secrets.XML_TEST_SECRET }}
        run: |
          # The secret is passed via env to avoid template substitution issues
          ENCODED=$(python3 -c "import os,html; print(html.escape(os.environ['S']))")
          echo "::notice file=README.md,line=1::XML-encoded value: $ENCODED"
